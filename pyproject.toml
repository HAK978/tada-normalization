[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tada-normalization"
version = "0.1.0"
description = "Normalize PrismHR, isolved and UKG Ready employee, direct-deposit, deduction and payroll data into one canonical model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
tada-normalize = "normalization.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
# The organizer's files keep their own formatting: contracts/, and the starter files we kept (A-02).
extend-exclude = [
    "contracts",
    "src/normalization/references.py",
    "tests/test_reference_integrity.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
files = ["src/normalization"]
plugins = ["pydantic.mypy"]
# The organizer's starter file keeps its own (untyped) style (A-02).
exclude = ["src/normalization/references\\.py"]
ignore_missing_imports = true
